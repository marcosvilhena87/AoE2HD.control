[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aoe2hdcontrol"
version = "0.1.0"
description = "Motor experimental de controle de Age of Empires II HD"
requires-python = ">=3.10"

[project.scripts]
aoe2hdcontrol = "aoe2hdcontrol.__main__:main"

[tool.setuptools.packages.find]
include = ["aoe2hdcontrol*"]
